spring.application.name=AwardWatch

# .env lives at the repo root, two directories up from this Gradle project
springdotenv.directory=../../

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Shared UTC daily allowance; automated callers leave 10% for manual searches.
quota.daily-limit=${QUOTA_DAILY_LIMIT:1000}

seats-aero.base-url=https://seats.aero/partnerapi/
seats-aero.api-key=${SEATS_AERO_API_KEY}

# Bound Partner API calls so transport stalls become typed source failures.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=30s
